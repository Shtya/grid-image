<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
  >

  <title>Tracing Grid</title>

  <style>

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html,
    body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: white;
      font-family: Arial, sans-serif;
    }

    body {
      touch-action: manipulation;
    }

    .app {
      width: 100%;
      height: 100dvh;
      display: flex;
      flex-direction: column;
      background: white;
    }

    /* =========================
       IMAGE AREA
    ========================= */

    .viewer-wrapper {
      width: 100%;
      aspect-ratio: 1 / 1;
      flex-shrink: 0;
      overflow: hidden;
      background: white;
    }

    .viewer {
      width: 100%;
      height: 100%;
      overflow: hidden;
      position: relative;
      background: white;
      touch-action: pan-y;
    }

    .image {
      position: absolute;

      width: 300%;
      height: 300%;

      max-width: none;
      max-height: none;

      left: 0;
      top: 0;

      display: block;

      user-select: none;
      -webkit-user-select: none;
      -webkit-user-drag: none;
      pointer-events: none;

      filter:
        grayscale(var(--gray))
        brightness(var(--brightness))
        contrast(var(--contrast))
        saturate(var(--saturation));

      opacity: var(--opacity);

      transition:
        left 0.2s ease,
        top 0.2s ease;
    }


    /* =========================
       CONTROLS AREA
    ========================= */

    .controls-area {
      flex: 1;
      min-height: 0;

      overflow-y: auto;

      background: #f5f5f5;

      border-top: 1px solid #ddd;

      padding: 10px 14px 18px;
    }


    .position {
      text-align: center;

      font-size: 13px;
      font-weight: bold;

      color: #333;

      margin-bottom: 9px;
    }


    /* =========================
       ARROWS
    ========================= */

    .controls {
      direction: ltr;

      display: grid;

      grid-template-columns:
        52px
        52px
        52px;

      grid-template-rows:
        52px
        52px
        52px;

      gap: 6px;

      justify-content: center;
    }


    button {
      width: 52px;
      height: 52px;

      border: 1px solid #d0d0d0;

      border-radius: 13px;

      background: white;

      color: #222;

      font-size: 24px;

      display: flex;
      align-items: center;
      justify-content: center;

      box-shadow:
        0 2px 8px rgba(0, 0, 0, 0.1);

      cursor: pointer;

      touch-action: manipulation;
    }


    button:active:not(:disabled) {
      transform: scale(0.92);
      background: #eee;
    }


    button:disabled {
      opacity: 0.3;
    }


    .up {
      grid-column: 2;
      grid-row: 1;
    }


    .left {
      grid-column: 1;
      grid-row: 2;
    }


    .home {
      grid-column: 2;
      grid-row: 2;
      font-size: 20px;
    }


    .right {
      grid-column: 3;
      grid-row: 2;
    }


    .down {
      grid-column: 2;
      grid-row: 3;
    }


    /* =========================
       IMAGE EFFECTS
    ========================= */

    .adjustments {
      max-width: 500px;

      margin: 12px auto 0;

      direction: rtl;
    }


    .adjustments-title {
      text-align: center;

      font-size: 13px;
      font-weight: bold;

      margin-bottom: 8px;
    }


    .slider-row {
      display: grid;

      grid-template-columns:
        70px
        1fr
        42px;

      align-items: center;

      gap: 7px;

      margin: 6px 0;
    }


    .slider-row label {
      font-size: 12px;
      color: #444;
    }


    .slider-row input {
      width: 100%;
      accent-color: #222;
    }


    .value {
      text-align: center;

      font-size: 11px;

      color: #666;
    }


    /* =========================
       PRESETS
    ========================= */

    .quick {
      display: flex;

      justify-content: center;

      gap: 7px;

      margin-top: 10px;
    }


    .quick button {
      width: auto;
      height: 36px;

      padding: 0 12px;

      border-radius: 9px;

      font-size: 12px;
    }


    /* =========================
       SMALL PHONES
    ========================= */

    @media (max-height: 650px) {

      .controls-area {
        padding-top: 6px;
      }

      .adjustments {
        margin-top: 6px;
      }

      .slider-row {
        margin: 3px 0;
      }

    }

  </style>
</head>


<body>


<div class="app">


  <!-- =========================
       IMAGE
  ========================== -->

  <div class="viewer-wrapper">

    <div
      class="viewer"
      id="viewer"
    >

      <!--
        ضع صورتك بجانب index.html
        وسمّها image.png
      -->

      <img
        id="image"
        class="image"
        src="image.png"
        alt="الصورة"
      >

    </div>

  </div>


  <!-- =========================
       CONTROLS
  ========================== -->

  <div class="controls-area">


    <div
      class="position"
      id="position"
    >
      المربع 1 من 9 — الصف 1، العمود 1
    </div>


    <div class="controls">


      <button
        id="up"
        class="up"
      >
        ↑
      </button>


      <button
        id="left"
        class="left"
      >
        ←
      </button>


      <button
        id="home"
        class="home"
      >
        ⌂
      </button>


      <button
        id="right"
        class="right"
      >
        →
      </button>


      <button
        id="down"
        class="down"
      >
        ↓
      </button>


    </div>


    <!-- =========================
         IMAGE SETTINGS
    ========================== -->

    <div class="adjustments">


      <div class="adjustments-title">
        تحسين الصورة للرسم
      </div>


      <!-- Contrast -->

      <div class="slider-row">

        <label>
          التباين
        </label>

        <input
          id="contrast"
          type="range"
          min="100"
          max="500"
          value="320"
        >

        <span
          id="contrastValue"
          class="value"
        >
          320%
        </span>

      </div>


      <!-- Brightness -->

      <div class="slider-row">

        <label>
          السطوع
        </label>

        <input
          id="brightness"
          type="range"
          min="70"
          max="140"
          value="110"
        >

        <span
          id="brightnessValue"
          class="value"
        >
          110%
        </span>

      </div>


      <!-- Saturation -->

      <div class="slider-row">

        <label>
          التشبع
        </label>

        <input
          id="saturation"
          type="range"
          min="0"
          max="200"
          value="0"
        >

        <span
          id="saturationValue"
          class="value"
        >
          0%
        </span>

      </div>


      <!-- Opacity -->

      <div class="slider-row">

        <label>
          الشفافية
        </label>

        <input
          id="opacity"
          type="range"
          min="20"
          max="100"
          value="92"
        >

        <span
          id="opacityValue"
          class="value"
        >
          92%
        </span>

      </div>


      <!-- Presets -->

      <div class="quick">

        <button id="traceMode">
          وضع الرسم
        </button>

        <button id="normalMode">
          طبيعي
        </button>

        <button id="blackMode">
          أسود قوي
        </button>

      </div>


    </div>


  </div>


</div>



<script>


/* =========================
   GRID POSITION
========================= */

let row = 0;

let col = 0;


const image =
  document.getElementById("image");


/* =========================
   UPDATE GRID
========================= */

function updateView() {

  /*
    شبكة:

    1 2 3
    4 5 6
    7 8 9
  */


  image.style.left =
    (-col * 100) + "%";


  image.style.top =
    (-row * 100) + "%";


  const square =
    row * 3 + col + 1;


  document
    .getElementById("position")
    .textContent =
    `المربع ${square} من 9 — الصف ${row + 1}، العمود ${col + 1}`;


  document
    .getElementById("up")
    .disabled =
    row === 0;


  document
    .getElementById("down")
    .disabled =
    row === 2;


  document
    .getElementById("left")
    .disabled =
    col === 0;


  document
    .getElementById("right")
    .disabled =
    col === 2;

}


/* =========================
   MOVE
========================= */

function move(rowChange, colChange) {

  row += rowChange;

  col += colChange;


  row =
    Math.max(
      0,
      Math.min(2, row)
    );


  col =
    Math.max(
      0,
      Math.min(2, col)
    );


  updateView();

}


/* =========================
   HOME
========================= */

function goHome() {

  row = 0;

  col = 0;

  updateView();

}


/* =========================
   BUTTONS
========================= */

document
  .getElementById("up")
  .onclick =
  () => move(-1, 0);


document
  .getElementById("down")
  .onclick =
  () => move(1, 0);


document
  .getElementById("left")
  .onclick =
  () => move(0, -1);


document
  .getElementById("right")
  .onclick =
  () => move(0, 1);


document
  .getElementById("home")
  .onclick =
  goHome;


/* =========================
   KEYBOARD
========================= */

document.addEventListener(
  "keydown",
  function(event) {

    if (event.key === "ArrowUp") {

      event.preventDefault();

      move(-1, 0);

    }


    if (event.key === "ArrowDown") {

      event.preventDefault();

      move(1, 0);

    }


    if (event.key === "ArrowLeft") {

      event.preventDefault();

      move(0, -1);

    }


    if (event.key === "ArrowRight") {

      event.preventDefault();

      move(0, 1);

    }


    if (event.key === "Home") {

      event.preventDefault();

      goHome();

    }

  }
);


/* =========================
   MOBILE SWIPE
========================= */

let startX = 0;

let startY = 0;


const viewer =
  document.getElementById("viewer");


viewer.addEventListener(
  "touchstart",
  function(event) {

    const touch =
      event.changedTouches[0];

    startX =
      touch.clientX;

    startY =
      touch.clientY;

  },
  {
    passive: true
  }
);


viewer.addEventListener(
  "touchend",
  function(event) {

    const touch =
      event.changedTouches[0];


    const dx =
      touch.clientX - startX;


    const dy =
      touch.clientY - startY;


    const threshold = 40;


    if (
      Math.abs(dx) < threshold &&
      Math.abs(dy) < threshold
    ) {

      return;

    }


    if (
      Math.abs(dx) >
      Math.abs(dy)
    ) {

      if (dx > 0) {

        move(0, -1);

      } else {

        move(0, 1);

      }

    } else {

      if (dy > 0) {

        move(-1, 0);

      } else {

        move(1, 0);

      }

    }

  },
  {
    passive: true
  }
);


/* =========================
   IMAGE EFFECTS
========================= */

const contrast =
  document.getElementById("contrast");


const brightness =
  document.getElementById("brightness");


const saturation =
  document.getElementById("saturation");


const opacity =
  document.getElementById("opacity");


function updateEffects() {

  image.style.setProperty(
    "--contrast",
    contrast.value + "%"
  );


  image.style.setProperty(
    "--brightness",
    brightness.value + "%"
  );


  image.style.setProperty(
    "--saturation",
    saturation.value + "%"
  );


  image.style.setProperty(
    "--opacity",
    opacity.value / 100
  );


  document
    .getElementById("contrastValue")
    .textContent =
    contrast.value + "%";


  document
    .getElementById("brightnessValue")
    .textContent =
    brightness.value + "%";


  document
    .getElementById("saturationValue")
    .textContent =
    saturation.value + "%";


  document
    .getElementById("opacityValue")
    .textContent =
    opacity.value + "%";

}


/* =========================
   SLIDERS
========================= */

contrast.addEventListener(
  "input",
  updateEffects
);


brightness.addEventListener(
  "input",
  updateEffects
);


saturation.addEventListener(
  "input",
  updateEffects
);


opacity.addEventListener(
  "input",
  updateEffects
);


/* =========================
   PRESETS
========================= */


/*
  أفضل إعداد مبدئي للرسم
*/

document
  .getElementById("traceMode")
  .onclick = function() {

    contrast.value = 320;

    brightness.value = 110;

    saturation.value = 0;

    opacity.value = 92;

    updateEffects();

  };


/*
  الوضع الطبيعي
*/

document
  .getElementById("normalMode")
  .onclick = function() {

    contrast.value = 100;

    brightness.value = 100;

    saturation.value = 100;

    opacity.value = 100;

    updateEffects();

  };


/*
  خطوط قوية
*/

document
  .getElementById("blackMode")
  .onclick = function() {

    contrast.value = 500;

    brightness.value = 105;

    saturation.value = 0;

    opacity.value = 100;

    updateEffects();

  };


/* =========================
   START
========================= */

updateView();

updateEffects();

</script>

</body>
</html>
