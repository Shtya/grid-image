<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
  >

  <title>3×3 Image Grid Viewer</title>

  <style>

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html,
    body {
      margin: 0;
      padding: 0;

      width: 100%;
      height: 100%;

      overflow: hidden;

      background: #ffffff;

      font-family: Arial, sans-serif;
    }

    body {
      display: flex;
      justify-content: center;
      align-items: center;
    }


    /* =========================================
       MAIN APP
    ========================================= */

    .app {
      width: 100%;
      height: 100dvh;

      display: flex;
      flex-direction: column;

      background: #ffffff;
    }


    /* =========================================
       IMAGE CONTAINER
    ========================================= */

    .viewer-wrapper {

      width: 100%;

      /*
        الصورة مربعة، لذلك نحافظ على
        نسبة 1:1 للـ container
      */

      aspect-ratio: 1 / 1;

      flex-shrink: 0;

      background: #ffffff;

      overflow: hidden;

      position: relative;
    }


    /*
      الـ viewport الحقيقي للمربع الحالي
    */

    .viewer {

      width: 100%;
      height: 100%;

      overflow: hidden;

      position: relative;

      background: white;

      touch-action: pan-y;
    }


    /*
      الصورة الأصلية

      نكبرها 3 مرات لكي تمثل شبكة 3×3.

      لا يوجد object-fit هنا.
      الصورة تعتمد على حجم الـ container.
    */

    .image {

      position: absolute;

      width: 300%;
      height: 300%;

      max-width: none;
      max-height: none;

      left: 0;
      top: 0;

      display: block;

      user-select: none;
      -webkit-user-select: none;
      -webkit-user-drag: none;
      pointer-events: none;

      transition:
        left 0.2s ease,
        top 0.2s ease;
    }


    /* =========================================
       CONTROLS AREA
    ========================================= */

    .controls-area {

      flex: 1;

      min-height: 0;

      display: flex;
      flex-direction: column;

      justify-content: flex-start;
      align-items: center;

      padding-top: 14px;

      background: #f5f5f5;

      border-top: 1px solid #ddd;
    }


    /* رقم المربع */

    .position {

      margin-bottom: 12px;

      font-size: 14px;

      font-weight: bold;

      color: #333;

      direction: rtl;
    }


    /* =========================================
       ARROW CONTROLS
    ========================================= */

    .controls {

      direction: ltr;

      display: grid;

      grid-template-columns:
        58px
        58px
        58px;

      grid-template-rows:
        58px
        58px
        58px;

      gap: 7px;

      justify-content: center;
      align-items: center;
    }


    button {

      width: 58px;
      height: 58px;

      border: 1px solid #d0d0d0;

      border-radius: 14px;

      background: #ffffff;

      color: #222;

      font-size: 27px;

      display: flex;

      align-items: center;
      justify-content: center;

      cursor: pointer;

      box-shadow:
        0 3px 10px rgba(0, 0, 0, 0.10);

      transition:
        transform 0.12s ease,
        background 0.12s ease;
    }


    button:active:not(:disabled) {

      transform: scale(0.92);

      background: #eeeeee;
    }


    button:disabled {

      opacity: 0.3;

      cursor: not-allowed;
    }


    /* أماكن الأسهم */

    .up {

      grid-column: 2;
      grid-row: 1;
    }


    .left {

      grid-column: 1;
      grid-row: 2;
    }


    .home {

      grid-column: 2;
      grid-row: 2;

      font-size: 20px;
    }


    .right {

      grid-column: 3;
      grid-row: 2;
    }


    .down {

      grid-column: 2;
      grid-row: 3;
    }


    /* =========================================
       MOBILE
    ========================================= */

    @media (max-width: 600px) {

      .controls-area {

        padding-top: 10px;
      }


      .position {

        font-size: 13px;

        margin-bottom: 8px;
      }


      .controls {

        grid-template-columns:
          52px
          52px
          52px;

        grid-template-rows:
          52px
          52px
          52px;

        gap: 6px;
      }


      button {

        width: 52px;
        height: 52px;

        font-size: 24px;
      }

    }


    /* =========================================
       VERY SMALL PHONES
    ========================================= */

    @media (max-height: 650px) {

      .controls-area {

        padding-top: 6px;
      }


      .position {

        margin-bottom: 5px;

        font-size: 12px;
      }


      .controls {

        grid-template-columns:
          46px
          46px
          46px;

        grid-template-rows:
          46px
          46px
          46px;

        gap: 5px;
      }


      button {

        width: 46px;
        height: 46px;

        font-size: 21px;
      }

    }

  </style>

</head>


<body>


  <div class="app">


    <!-- =====================================
         IMAGE
    ====================================== -->

    <div class="viewer-wrapper">

      <div
        class="viewer"
        id="viewer"
      >

        <img
          id="image"
          class="image"
          src="image.png"
          alt="الصورة"
        >

      </div>

    </div>


    <!-- =====================================
         CONTROLS
    ====================================== -->

    <div class="controls-area">


      <div
        class="position"
        id="position"
      >
        المربع 1 من 9 — الصف 1، العمود 1
      </div>


      <div class="controls">


        <!-- UP -->

        <button
          id="up"
          class="up"
          aria-label="أعلى"
        >
          ↑
        </button>


        <!-- LEFT -->

        <button
          id="left"
          class="left"
          aria-label="يسار"
        >
          ←
        </button>


        <!-- HOME -->

        <button
          id="home"
          class="home"
          aria-label="البداية"
        >
          ⌂
        </button>


        <!-- RIGHT -->

        <button
          id="right"
          class="right"
          aria-label="يمين"
        >
          →
        </button>


        <!-- DOWN -->

        <button
          id="down"
          class="down"
          aria-label="أسفل"
        >
          ↓
        </button>


      </div>


    </div>


  </div>


  <script>


    /* =========================================
       CURRENT GRID POSITION
    ========================================= */

    let row = 0;

    let col = 0;


    /* =========================================
       UPDATE IMAGE
    ========================================= */

    function updateView() {

      const image =
        document.getElementById("image");


      /*
        كل حركة = ثلث الصورة
      */

      image.style.left =
        (-col * 100) + "%";


      image.style.top =
        (-row * 100) + "%";


      /*
        رقم المربع

        1 2 3
        4 5 6
        7 8 9
      */

      const square =
        row * 3 + col + 1;


      document
        .getElementById("position")
        .textContent =
        `المربع ${square} من 9 — الصف ${row + 1}، العمود ${col + 1}`;


      /*
        Disable buttons at edges
      */

      document
        .getElementById("up")
        .disabled =
        row === 0;


      document
        .getElementById("down")
        .disabled =
        row === 2;


      document
        .getElementById("left")
        .disabled =
        col === 0;


      document
        .getElementById("right")
        .disabled =
        col === 2;

    }


    /* =========================================
       MOVE
    ========================================= */

    function move(rowChange, colChange) {

      row += rowChange;

      col += colChange;


      /*
        Don't go outside 3×3
      */

      row =
        Math.max(
          0,
          Math.min(2, row)
        );


      col =
        Math.max(
          0,
          Math.min(2, col)
        );


      updateView();

    }


    /* =========================================
       HOME
    ========================================= */

    function goHome() {

      row = 0;

      col = 0;

      updateView();

    }


    /* =========================================
       BUTTON EVENTS
    ========================================= */

    document
      .getElementById("up")
      .addEventListener(
        "click",
        () => move(-1, 0)
      );


    document
      .getElementById("down")
      .addEventListener(
        "click",
        () => move(1, 0)
      );


    document
      .getElementById("left")
      .addEventListener(
        "click",
        () => move(0, -1)
      );


    document
      .getElementById("right")
      .addEventListener(
        "click",
        () => move(0, 1)
      );


    document
      .getElementById("home")
      .addEventListener(
        "click",
        goHome
      );


    /* =========================================
       KEYBOARD SUPPORT
    ========================================= */

    document.addEventListener(
      "keydown",
      function(event) {

        switch (event.key) {

          case "ArrowUp":

            event.preventDefault();

            move(-1, 0);

            break;


          case "ArrowDown":

            event.preventDefault();

            move(1, 0);

            break;


          case "ArrowLeft":

            event.preventDefault();

            move(0, -1);

            break;


          case "ArrowRight":

            event.preventDefault();

            move(0, 1);

            break;


          case "Home":

            event.preventDefault();

            goHome();

            break;

        }

      }
    );


    /* =========================================
       MOBILE SWIPE
    ========================================= */

    let startX = 0;

    let startY = 0;


    const viewer =
      document.getElementById("viewer");


    viewer.addEventListener(
      "touchstart",
      function(event) {

        const touch =
          event.changedTouches[0];

        startX =
          touch.clientX;

        startY =
          touch.clientY;

      },
      {
        passive: true
      }
    );


    viewer.addEventListener(
      "touchend",
      function(event) {

        const touch =
          event.changedTouches[0];


        const deltaX =
          touch.clientX - startX;


        const deltaY =
          touch.clientY - startY;


        const threshold = 40;


        /*
          Ignore small touches
        */

        if (
          Math.abs(deltaX) < threshold &&
          Math.abs(deltaY) < threshold
        ) {

          return;

        }


        /*
          Horizontal swipe
        */

        if (
          Math.abs(deltaX) >
          Math.abs(deltaY)
        ) {

          if (deltaX > 0) {

            move(0, -1);

          } else {

            move(0, 1);

          }

        }


        /*
          Vertical swipe
        */

        else {

          if (deltaY > 0) {

            move(-1, 0);

          } else {

            move(1, 0);

          }

        }

      },
      {
        passive: true
      }
    );


    /* =========================================
       INITIALIZE
    ========================================= */

    updateView();

  </script>


</body>

</html>
